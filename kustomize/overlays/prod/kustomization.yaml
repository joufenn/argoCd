apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-prod

resources:
  - ../../base

# 生产环境：3 个副本
replicas:
  - name: demo-nginx
    count: 3

# 生产环境钉死一个具体版本，不用浮动 tag
images:
  - name: nginx
    newTag: 1.27.1-alpine

# 除了 replicas / images，还能用 patch 改 base 里任意字段。
# 这里用 JSON6902 patch 把内存上限从 128Mi 提到 256Mi。
patches:
  - target:
      kind: Deployment
      name: demo-nginx
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 256Mi
